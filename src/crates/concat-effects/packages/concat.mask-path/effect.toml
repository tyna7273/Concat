format = 2

[effect]
id = "concat.mask-path"
name = "Mask Path (Pen Tool)"
kind = "effect"
category = "Cutout"
order = 1
intensity = "opacity"
description = "Pen tool custom mask path. Define polygon or bezier anchor points to cut out, isolate, or mask any subject or region of the video."

[[param]]
